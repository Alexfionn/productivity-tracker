name: Daily Track to Notion

on:
  repository_dispatch:
    types: [daily_track]

jobs:
  write-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Send entry to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 <<'PYEOF'
          import os, json, urllib.request, urllib.error

          payload = json.loads(os.environ["PAYLOAD"])
          token   = os.environ["NOTION_TOKEN"]
          db_id   = os.environ["NOTION_DATABASE_ID"]

          # Map slider values into Notion property format
          properties = {
              "Date": {
                  "date": {"start": payload["date"]}
              },
              "Deep Work Hours": {
                  "number": float(payload["deepWorkHours"])
              },
              "Execution vs Plan": {
                  "number": int(payload["executionVsPlan"])
              },
              "Mental Energy": {
                  "number": int(payload["mentalEnergy"])
              },
              "Resistance": {
                  "number": int(payload["resistance"])
              },
              "Meaning": {
                  "number": int(payload["meaning"])
              },
              "Environment": {
                  "number": int(payload["environment"])
              },
              "Distraction": {
                  "number": int(payload["distraction"])
              },
              "Note": {
                  "rich_text": [
                      {"text": {"content": payload.get("note", "")[:2000]}}
                  ]
              },
              # Title field — Notion requires every page to have one
              "Name": {
                  "title": [
                      {"text": {"content": payload["date"]}}
                  ]
              }
          }

          body = {
              "parent": {"database_id": db_id},
              "properties": properties
          }

          req = urllib.request.Request(
              "https://api.notion.com/v1/pages",
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Notion-Version": "2022-06-28",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as r:
                  print("OK:", r.status)
                  print(r.read().decode("utf-8")[:500])
          except urllib.error.HTTPError as e:
              print("HTTP error:", e.code)
              print(e.read().decode("utf-8"))
              raise
          PYEOF
